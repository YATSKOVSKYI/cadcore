[package]
name             = "cadcore-union"
version.workspace    = true
edition.workspace    = true
authors.workspace    = true
repository.workspace = true
homepage.workspace   = true
license.workspace    = true
rust-version.workspace = true
readme       = "README.md"
description  = "Industrial Boolean-union engine for the cadcore CAD kernel - staged pipeline, analytic intersection oracle, refinement to emitted geometry, in-process validation gates"
keywords     = ["cad", "brep", "boolean", "union", "geometry"]
categories   = ["science"]

[dependencies]
cadcore-math = { path = "../cadcore-math", version = "0.1.22" }
cadcore-geom = { path = "../cadcore-geom", version = "0.1.22" }
cadcore-topo = { path = "../cadcore-topo", version = "0.1.22" }

[dev-dependencies]
cadcore-step = { path = "../cadcore-step", version = "0.1.22" }
